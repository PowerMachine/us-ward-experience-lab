name: Build macOS unsigned app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos.yml"
      - "requirements.txt"
      - "work/**"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build unsigned macOS app
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run content self-test
        run: python work/us_ward_simulator.py --self-test

      - name: Generate macOS icon
        run: |
          ICONSET="work/assets/USWardExperienceLab.iconset"
          SRC="work/assets/us-ward-icon.png"
          mkdir -p "$ICONSET"
          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o work/assets/us-ward-icon.icns

      - name: Build unsigned macOS app
        run: |
          pyinstaller --noconfirm --clean \
            --distpath dist-macos \
            --workpath build-macos \
            work/USWardExperienceLab-macos.spec

      - name: Package app zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist-macos/USWardExperienceLab.app \
            USWardExperienceLab_macos_unsigned_v0.1.1-beta.zip
          shasum -a 256 USWardExperienceLab_macos_unsigned_v0.1.1-beta.zip > USWardExperienceLab_macos_unsigned_v0.1.1-beta.sha256

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: USWardExperienceLab_macos_unsigned_v0.1.1-beta
          path: |
            USWardExperienceLab_macos_unsigned_v0.1.1-beta.zip
            USWardExperienceLab_macos_unsigned_v0.1.1-beta.sha256
          if-no-files-found: error
